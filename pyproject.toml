[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr-evidence-lab"
version = "0.1.0"
description = "EGFR bioactivity prediction and literature evidence project scaffold"
requires-python = ">=3.11"
dependencies = []

# P0 is validated separately; later-stage extras remain candidates.
[project.optional-dependencies]
p0 = ["httpx", "pandas", "numpy", "rdkit", "pyarrow"]
ml = ["httpx", "pandas", "numpy", "scipy", "scikit-learn", "rdkit", "pyarrow", "matplotlib", "joblib"]
deep = ["chemprop>=2,<3"]
literature = ["httpx", "rank-bm25", "pydantic"]
dense = ["sentence-transformers", "faiss-cpu"]
agent = ["langgraph", "pydantic"]
tracking = ["mlflow"]
app = ["fastapi", "uvicorn", "streamlit"]
# M6 추론 서비스. 버전은 deployment/requirements-serve.txt 에 고정한다.
# 모델을 저장할 때 쓴 scikit-learn·joblib·numpy 버전과 같아야 한다.
serve = ["fastapi", "uvicorn", "pydantic", "scikit-learn", "rdkit", "joblib",
         "numpy", "scipy", "httpx"]
cloud = ["boto3"]
pdf = ["reportlab", "pypdf", "pillow"]

[project.scripts]
egfr-lab = "egfr_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
